# This workflow will install hdwallet.js dependencies, run tests, collect coverage, and submit it to Coveralls.

name: hdwallet.js

on:
  push:
    branches:
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches:
      - master

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [
          '20', '22', '24'
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@master
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@master
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests with Coverage
        run: npm run test:coverage
      - name: Report Coverage Summary
        run: cat ./coverage/lcov.info | head -n 20 || echo "lcov report generated"
      - name: Submit Coverage to Coveralls
        if: ${{ matrix.node-version == 20 && github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
          coveralls-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
